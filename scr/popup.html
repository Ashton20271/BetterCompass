<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Compass</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #000000;
        color: #f8fafc;
        width: 220px;
      }
      .popup {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .theme-select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        background: #1f2937;
        color: #f8fafc;
        font-size: 13px;
        cursor: pointer;
      }
      button.black {
        background: #0f172a;
        color: #f8fafc;
      }
      button.off {
        background: #475569;
        color: #f8fafc;
      }
      .field {
        margin-top: 12px;
        display: grid;
        gap: 8px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .field input[type="color"], .field input[type="text"], .field input[type="file"], .field input[type="range"] {
        width: 100%;
        height: 34px;
        border: none;
        padding: 0 10px;
        border-radius: 8px;
        background: #111827;
        color: #f8fafc;
        cursor: pointer;
      }
      .field input[type="file"] {
        padding: 0;
        height: auto;
      }
      .field input[type="range"] {
        padding: 0;
        height: auto;
      }
      .range-value {
        font-size: 12px;
        color: #94a3b8;
      }
      .background-preview {
        width: 100%;
        max-height: 140px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #334155;
        display: none;
      }
      .background-row {
        display: grid;
        gap: 8px;
      }
      .toggle-row {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: #94a3b8;
      }
      .links {
        margin-top: 14px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .icon-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #1f2937;
        color: #f8fafc;
        text-decoration: none;
        font-size: 13px;
        transition: background 0.15s ease;
      }
      .icon-link:hover {
        background: #334155;
      }
      .icon-link svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <h1>Better Compass</h1>
      <div class="field">
        <label for="themeSelect">Theme
          <select id="themeSelect" class="theme-select">
            <option value="off">Default Theme</option>
            <option value="black">Black Theme</option>
            <option value="clear">Transparent</option>
          </select>
        </label>
      </div>
      <div class="field background-row">
        <label for="backgroundImage">Background url (use transparent) — Thanks to <a href="https://github.com/eaDC22mn" target="_blank" rel="noopener noreferrer">eaDC22mn</a> for part of background feature</label>
        <input id="backgroundImage" type="text" placeholder="image url">
        <label for="backgroundFile">Upload image</label>
        <input id="backgroundFile" type="file" accept="image/*">
        <label for="backgroundOpacity">Background opacity <span id="backgroundOpacityValue" class="range-value">75%</span></label>
        <input id="backgroundOpacity" type="range" min="0" max="100" step="1">
        <label for="backgroundBlur">Background blur <span id="backgroundBlurValue" class="range-value">8px</span></label>
        <input id="backgroundBlur" type="range" min="0" max="32" step="1">
        <button id="clearBackground" class="off" type="button">Clear background</button>
        <img id="backgroundPreview" class="background-preview" alt="Preview">
      </div>
      <div class="field">
        <label for="bgColor">Page background <input id="bgColor" type="color"></label>
        <label for="textColor">Text color <input id="textColor" type="color"></label>
        <label for="headerColor">Header background <input id="headerColor" type="color"></label>
        <label for="headerTextColor">Header text <input id="headerTextColor" type="color"></label>
        <label for="cardColor">Card background <input id="cardColor" type="color"></label>
        <label for="cardTextColor">Card text <input id="cardTextColor" type="color"></label>
        <label for="buttonColor">Button background <input id="buttonColor" type="color"></label>
        <label for="buttonTextColor">Button text <input id="buttonTextColor" type="color"></label>
        <label for="linkColor">Link color <input id="linkColor" type="color"></label>
        <label for="borderColor">Border color <input id="borderColor" type="color"></label>
        <label for="accentColor">Accent color <input id="accentColor" type="color"></label>
        <button id="resetTheme" class="off" type="button">Reset theme</button>
      </div>
      <div class="toggle-row">
        <input id="autoLogin" type="checkbox">
        <label for="autoLogin">Auto login</label>
      </div>
      <div class="toggle-row">
        <input id="timetableColors" type="checkbox">
        <label for="timetableColors">Timetable colors</label>
      </div>
      <div class="toggle-row">
        <input id="blockTrackers" type="checkbox">
        <label for="blockTrackers">Block trackers</label>
      </div>
      <div class="field">
        <button id="exportSettings" class="black" type="button">Export settings</button>
        <button id="importSettings" class="off" type="button">Import settings</button>
        <input id="importFile" type="file" accept=".json,application/json" style="display:none" />
      </div>
      <div class="links">
        <a class="icon-link" href="https://discord.gg/wbDaE6TkRk" target="_blank" rel="noopener noreferrer" aria-label="Discord">
          <svg viewBox="0 0 71 55" aria-hidden="true"><path d="M60.7 4.5a58.9 58.9 0 00-14.3-4.5s-1.4 2.4-2.7 4.5c-8.9-1.3-17.4-1.3-26.1 0C16.9 2.4 15.5 0 15.5 0 6.9 1.6.4 6 .4 6a59 59 0 00-4.2 18.2c0 0 3.1 2.4 5.6 4.5 0 0 2.4 2.8 4.4 5.1 8.8 10.8 24 11.7 24 11.7l1.7-2.2c-7.5-1-10.4-3.4-10.4-3.4 2.1 1.4 4.1 2.4 6 3.1 11.9 4.1 24.5-1.5 24.5-1.5l1.1 1.8s12.2-.6 21.4-12.5c2-2.4 4.1-5.1 4.1-5.1 2.6-2.1 5.6-4.5 5.6-4.5A59 59 0 0070.6 6c0 0-6.4-4.4-9.9-1.5zM23.7 35.9c-4.9 0-8.8-4.5-8.8-10s3.9-10 8.8-10 8.8 4.5 8.8 10-4 10-8.8 10zm23.6 0c-4.9 0-8.8-4.5-8.8-10s3.9-10 8.8-10 8.8 4.5 8.8 10-3.9 10-8.8 10z"/></svg>
        </a>
        <a class="icon-link" href="https://github.com/Ashton20271/better-compass" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.263.82-.583 0-.288-.01-1.05-.015-2.06-3.338.724-4.042-1.61-4.042-1.61-.546-1.386-1.333-1.755-1.333-1.755-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.238 1.84 1.238 1.07 1.835 2.807 1.305 3.492.998.107-.776.418-1.305.76-1.605-2.665-.3-5.467-1.332-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.124-.303-.535-1.523.117-3.176 0 0 1.008-.323 3.3 1.23a11.5 11.5 0 013.005-.404c1.02.005 2.045.138 3.005.404 2.292-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.118 3.176.77.84 1.234 1.91 1.234 3.22 0 4.61-2.807 5.625-5.48 5.92.43.37.813 1.102.813 2.222 0 1.606-.015 2.9-.015 3.293 0 .322.216.7.825.582C20.565 21.796 24 17.297 24 12c0-6.63-5.373-12-12-12z"/></svg>
        </a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
