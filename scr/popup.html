<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Compass</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #f8fafc;
        width: 220px;
      }
      .popup {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      button.black {
        background: #0f172a;
        color: #f8fafc;
      }
      button.off {
        background: #475569;
        color: #f8fafc;
      }
      .field {
        margin-top: 12px;
        display: grid;
        gap: 8px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .field input[type="color"] {
        width: 100%;
        height: 34px;
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }
      .toggle-row {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <h1>Better Compass</h1>
      <button class="black" data-mode="black">Black Theme</button>
      <button class="off" data-mode="off">Default Theme</button>
      <div class="field">
        <label for="bgColor">Page background <input id="bgColor" type="color"></label>
        <label for="textColor">Text color <input id="textColor" type="color"></label>
        <label for="headerColor">Header background <input id="headerColor" type="color"></label>
        <label for="headerTextColor">Header text <input id="headerTextColor" type="color"></label>
        <label for="cardColor">Card background <input id="cardColor" type="color"></label>
        <label for="cardTextColor">Card text <input id="cardTextColor" type="color"></label>
        <label for="buttonColor">Button background <input id="buttonColor" type="color"></label>
        <label for="buttonTextColor">Button text <input id="buttonTextColor" type="color"></label>
        <label for="linkColor">Link color <input id="linkColor" type="color"></label>
        <label for="borderColor">Border color <input id="borderColor" type="color"></label>
        <label for="accentColor">Accent color <input id="accentColor" type="color"></label>
        <button id="resetTheme" class="off" type="button">Reset theme</button>
      </div>
      <div class="toggle-row">
        <input id="autoLogin" type="checkbox">
        <label for="autoLogin">Auto login (SAML)</label>
      </div>
      <div class="toggle-row">
        <input id="timetableColors" type="checkbox">
        <label for="timetableColors">Enable timetable colors</label>
      </div>
      <div class="hint">Customize major page colors, then refresh the site if needed.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
